<text x="410" y="26" text-anchor="middle" font-size="20" font-weight="500" fill="#0f172a" color="#0f172a">seven real systems, four criteria: no row clears three</text>

<text x="90" y="58" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" color="#64748b">system</text>
<text x="240" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" color="#64748b">(a) concurrent</text>
<text x="240" y="66" text-anchor="middle" font-size="11" fill="#94a3b8" color="#94a3b8">multi-agent KB</text>
<text x="390" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" color="#64748b">(b) telemetry</text>
<text x="390" y="66" text-anchor="middle" font-size="11" fill="#94a3b8" color="#94a3b8">to retraining</text>
<text x="540" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" color="#64748b">(c) multi-modal</text>
<text x="540" y="66" text-anchor="middle" font-size="11" fill="#94a3b8" color="#94a3b8">memory</text>
<text x="690" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" color="#64748b">(d) model-aware</text>
<text x="690" y="66" text-anchor="middle" font-size="11" fill="#94a3b8" color="#94a3b8">routing</text>

<line x1="10" y1="78" x2="810" y2="78" stroke="#cbd5e1" stroke-width="1"/>

