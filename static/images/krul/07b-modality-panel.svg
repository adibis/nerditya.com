<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace"><defs><style>
text { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 400; stroke: currentColor; stroke-width: 0.35px; paint-order: stroke fill; }
</style>
<marker id="arrow07b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
</marker>
</defs>

<text x="400" y="26" text-anchor="middle" font-size="17" font-weight="500" fill="#0f172a" color="#0f172a">multi-modal memory: what five vendors do, and the one cheap change</text>

<!-- left: caption and discard -->
<rect x="20" y="50" width="360" height="220" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5"/>
<text x="200" y="74" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">every vendor checked: caption, discard</text>

<rect x="50" y="94" width="120" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110" y="124" text-anchor="middle" font-size="12" fill="#0f172a" color="#0f172a">image / audio</text>

<line x1="170" y1="119" x2="206" y2="119" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow07b)"/>

<rect x="210" y="94" width="140" height="50" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="280" y="124" text-anchor="middle" font-size="12" fill="#0f172a" color="#0f172a">text caption</text>

<text x="110" y="180" text-anchor="middle" font-size="30" fill="#b45309" color="#b45309">✕</text>
<text x="110" y="204" text-anchor="middle" font-size="11" fill="#b45309" color="#b45309">original</text>
<text x="110" y="218" text-anchor="middle" font-size="11" fill="#b45309" color="#b45309">discarded</text>

<text x="200" y="248" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">Mem0, Google Memory Bank, Zep,</text>
<text x="200" y="262" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">Letta, Anthropic's memory tool</text>

<!-- right: keep the artifact -->
<rect x="420" y="50" width="360" height="220" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="600" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#0f172a" color="#0f172a">the modest fix: keep it too</text>

<rect x="450" y="94" width="120" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="510" y="124" text-anchor="middle" font-size="12" fill="#0f172a" color="#0f172a">image / audio</text>

<line x1="570" y1="119" x2="606" y2="119" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrow07b)"/>
<line x1="510" y1="144" x2="510" y2="190" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrow07b)"/>

<rect x="610" y="94" width="140" height="50" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="680" y="124" text-anchor="middle" font-size="12" fill="#0f172a" color="#0f172a">text caption</text>

<rect x="450" y="194" width="300" height="60" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="600" y="214" text-anchor="middle" font-size="12" fill="#0f172a" color="#0f172a">original, content-addressed</text>
<text x="600" y="232" text-anchor="middle" font-size="10" fill="#64748b" color="#64748b">not indexed by content —</text>
<text x="600" y="246" text-anchor="middle" font-size="10" fill="#64748b" color="#64748b">just not thrown away</text>

<text x="400" y="288" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">caption stays the primary retrieval path —</text>
<text x="400" y="303" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">the blob is there when something needs it</text>
</svg>
