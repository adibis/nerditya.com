<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace"><defs><style>
text { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 400; stroke: currentColor; stroke-width: 0.35px; paint-order: stroke fill; }
</style>
<marker id="arrow06b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
</marker>
</defs>

<text x="400" y="26" text-anchor="middle" font-size="17" font-weight="500" fill="#0f172a" color="#0f172a">a real mechanism, wired to a problem it was never built for</text>

<rect x="30" y="56" width="320" height="100" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="190" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#0f172a" color="#0f172a">Cursor (real, first-party)</text>
<text x="190" y="100" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">production outcome signal →</text>
<text x="190" y="116" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">online RL reward → weight update</text>
<text x="190" y="136" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">supplies: the whole retraining loop</text>

<rect x="450" y="56" width="320" height="100" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="610" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#0f172a" color="#0f172a">this series' own design</text>
<text x="610" y="100" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">shared store, open-membership</text>
<text x="610" y="116" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">writers — agents, tests, humans</text>
<text x="610" y="136" text-anchor="middle" font-size="10" fill="#64748b" color="#64748b">supplies: the multi-writer memory</text>

<line x1="190" y1="156" x2="330" y2="200" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrow06b)"/>
<line x1="610" y1="156" x2="470" y2="200" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrow06b)"/>

<rect x="250" y="204" width="300" height="90" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5"/>
<text x="400" y="230" text-anchor="middle" font-size="14" font-weight="500" fill="#0f172a" color="#0f172a">proposed: wire Cursor's loop</text>
<text x="400" y="248" text-anchor="middle" font-size="14" font-weight="500" fill="#0f172a" color="#0f172a">to an open, shared store</text>
<text x="400" y="270" text-anchor="middle" font-size="12" fill="#b45309" color="#b45309">the mechanism is proven —</text>
<text x="400" y="286" text-anchor="middle" font-size="12" fill="#b45309" color="#b45309">this combination isn't, anywhere</text>
</svg>
