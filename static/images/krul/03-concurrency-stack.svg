<svg viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace"><defs><style>
text { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 400; stroke: currentColor; stroke-width: 0.35px; paint-order: stroke fill; }
</style></defs>

<text x="450" y="26" text-anchor="middle" font-size="20" font-weight="500" fill="#0f172a" color="#0f172a">where the real guarantee stops, four systems checked directly</text>

<!-- Mem0 -->
<text x="112" y="56" text-anchor="middle" font-size="15" font-weight="500" fill="#0f172a" color="#0f172a">Mem0</text>
<rect x="20" y="66" width="185" height="230" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5"/>
<text x="112" y="150" text-anchor="middle" font-size="13" fill="#b45309" color="#b45309">no concurrency</text>
<text x="112" y="168" text-anchor="middle" font-size="13" fill="#b45309" color="#b45309">control anywhere</text>
<text x="112" y="196" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">TOCTOU race in</text>
<text x="112" y="212" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">add(), maintainer-</text>
<text x="112" y="228" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">accepted bug report,</text>
<text x="112" y="244" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">both SDKs</text>

<!-- Letta -->
<text x="332" y="56" text-anchor="middle" font-size="15" font-weight="500" fill="#0f172a" color="#0f172a">Letta</text>
<rect x="240" y="66" width="185" height="100" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="332" y="90" text-anchor="middle" font-size="13" fill="#0369a1" color="#0369a1">append: safe</text>
<text x="332" y="108" text-anchor="middle" font-size="13" fill="#0369a1" color="#0369a1">replace: conditional</text>
<text x="332" y="126" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">(optimistic string check)</text>
<rect x="240" y="176" width="185" height="120" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5"/>
<text x="332" y="200" text-anchor="middle" font-size="11" fill="#b45309" color="#b45309">rewrite: last-write-wins</text>
<text x="332" y="222" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">mitigation: "designate</text>
<text x="332" y="238" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">an owner" — process</text>
<text x="332" y="254" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">discipline, not a lock</text>

<!-- Graphiti -->
<text x="552" y="56" text-anchor="middle" font-size="15" font-weight="500" fill="#0f172a" color="#0f172a">Zep / Graphiti</text>
<rect x="460" y="66" width="185" height="100" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="552" y="90" text-anchor="middle" font-size="12" fill="#0369a1" color="#0369a1">Neo4j ACID transactions</text>
<text x="552" y="108" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">per operation, real</text>
<text x="552" y="124" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">commit/rollback</text>
<rect x="460" y="176" width="185" height="120" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="552" y="198" text-anchor="middle" font-size="11" fill="#b45309" color="#b45309">fixed: shared-driver race</text>
<text x="552" y="214" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">(19 episodes misfiled,</text>
<text x="552" y="230" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">now shipped fix)</text>
<text x="552" y="250" text-anchor="middle" font-size="12" fill="#b45309" color="#b45309">true ordering needs an</text>
<text x="552" y="266" text-anchor="middle" font-size="12" fill="#b45309" color="#b45309">optional add-on queue</text>

<!-- LangGraph -->
<text x="772" y="56" text-anchor="middle" font-size="15" font-weight="500" fill="#0f172a" color="#0f172a">LangGraph</text>
<rect x="680" y="66" width="185" height="100" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="772" y="90" text-anchor="middle" font-size="13" fill="#0369a1" color="#0369a1">Postgres ON CONFLICT</text>
<text x="772" y="108" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">DO UPDATE, genuine</text>
<text x="772" y="124" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">atomic serialization</text>
<rect x="680" y="176" width="185" height="120" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5"/>
<text x="772" y="200" text-anchor="middle" font-size="12" fill="#b45309" color="#b45309">open race in scheduler</text>
<text x="772" y="216" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">PregelLoop.put_writes(),</text>
<text x="772" y="232" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">drops writes before</text>
<text x="772" y="248" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">they reach the safe DB</text>
<text x="772" y="264" text-anchor="middle" font-size="12" fill="#b45309" color="#b45309">layer at all</text>

<line x1="20" y1="322" x2="865" y2="322" stroke="#cbd5e1" stroke-width="1"/>
<text x="450" y="342" text-anchor="middle" font-size="13" fill="#64748b" color="#64748b">none use CRDTs or event sourcing — every guarantee here is borrowed</text>
<text x="450" y="359" text-anchor="middle" font-size="13" fill="#64748b" color="#64748b">from a general-purpose database, not invented for "agent memory"</text>
<text x="450" y="380" text-anchor="middle" font-size="13" fill="#64748b" color="#64748b">a correct database layer (blue) doesn't guarantee a correct system above it (amber)</text>
</svg>
