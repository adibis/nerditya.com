<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace"><defs><style>
text { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 400; stroke: currentColor; stroke-width: 0.35px; paint-order: stroke fill; }
</style>
<marker id="arrowflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
</marker>
<marker id="arrowflowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#df8e1d"/>
</marker>
</defs>

<text x="500" y="26" text-anchor="middle" font-size="19" font-weight="500" fill="#0f172a" color="#0f172a">the whole system: writers in, evaporation running, one loop still open</text>

<!-- orchestrator / daemon: dispatches the agent fleet, holds no state itself -->
<rect x="350" y="44" width="300" height="50" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="500" y="64" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">orchestrator (daemon)</text>
<text x="500" y="80" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">dispatches work, holds no state itself</text>

<line x1="500" y1="94" x2="500" y2="116" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowflow)"/>

<rect x="150" y="120" width="700" height="60" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="500" y="146" text-anchor="middle" font-size="13" fill="#0f172a" color="#0f172a">a fleet of agents, on Linux processes, against several models</text>
<text x="500" y="164" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">short-lived, narrow calls — the daemon persists, the calls don't</text>

<line x1="500" y1="180" x2="230" y2="206" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowflow)"/>

<!-- writer row -->
<rect x="130" y="210" width="170" height="60" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="215" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">Agents</text>
<text x="215" y="254" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">judgment calls</text>

<rect x="320" y="210" width="170" height="60" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="405" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">Regression</text>
<text x="405" y="254" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">test results</text>

<rect x="510" y="210" width="170" height="60" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="595" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">Telemetry</text>
<text x="595" y="254" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">error signals</text>

<rect x="700" y="210" width="170" height="60" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
<text x="785" y="236" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">Humans</text>
<text x="785" y="254" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">corrections</text>

<line x1="215" y1="270" x2="400" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowflow)"/>
<line x1="405" y1="270" x2="450" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowflow)"/>
<line x1="595" y1="270" x2="550" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowflow)"/>
<line x1="785" y1="270" x2="600" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowflow)"/>

<!-- concurrency layer -->
<rect x="200" y="314" width="600" height="50" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="500" y="336" text-anchor="middle" font-size="14" font-weight="500" fill="#0f172a" color="#0f172a">concurrency layer</text>
<text x="500" y="352" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">a lock or a real transaction — chosen by tier, not assumed</text>

<line x1="500" y1="364" x2="500" y2="390" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowflow)"/>

<!-- shared store -->
<rect x="250" y="394" width="500" height="80" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
<text x="500" y="422" text-anchor="middle" font-size="16" font-weight="500" fill="#0f172a" color="#0f172a">shared knowledge store</text>
<text x="500" y="442" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">writer-typed records, evaporating strength</text>
<text x="500" y="458" text-anchor="middle" font-size="12" fill="#64748b" color="#64748b">no batch job — decay computed at read time</text>

<!-- left branch: query -->
<line x1="380" y1="474" x2="320" y2="510" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowflow)"/>
<rect x="150" y="514" width="250" height="60" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="275" y="540" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">query / retrieval</text>
<text x="275" y="558" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">reads current strength</text>

<line x1="275" y1="574" x2="275" y2="600" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowflow)"/>
<rect x="150" y="604" width="250" height="60" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="275" y="630" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">models</text>
<text x="275" y="648" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">routed above, model-agnostic</text>

<!-- right branch: telemetry to retraining -->
<line x1="620" y1="474" x2="680" y2="510" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowflow)"/>
<rect x="600" y="514" width="250" height="60" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="725" y="540" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" color="#0f172a">usage &amp; outcome signals</text>
<text x="725" y="558" text-anchor="middle" font-size="11" fill="#64748b" color="#64748b">which memories got used</text>

<line x1="725" y1="574" x2="725" y2="600" stroke="#df8e1d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowflowamber)"/>
<rect x="600" y="604" width="250" height="60" rx="8" fill="#fffbeb" stroke="#df8e1d" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="725" y="630" text-anchor="middle" font-size="13" font-weight="500" fill="#b45309" color="#b45309">retraining (proposed)</text>
<text x="725" y="648" text-anchor="middle" font-size="11" fill="#b45309" color="#b45309">genuinely speculative</text>

<path d="M 600 634 C 470 634, 470 634, 400 634" fill="none" stroke="#df8e1d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowflowamber)"/>
<text x="500" y="674" text-anchor="middle" font-size="11" fill="#b45309" color="#b45309">the one dashed line — retraining is real, wiring it to shared memory isn't</text>
</svg>
